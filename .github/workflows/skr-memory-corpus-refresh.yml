name: SKR Memory Corpus Refresh

on:
  push:
    branches: [skr-docs-memory-completeness]
    paths:
      - "memory/**"
      - "memory.md"
      - "policy/public_release_policy.json"
      - "_data/navigation.yml"
      - ".github/workflows/skr-memory-corpus-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: skr-docs-memory-completeness
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Regenerate deterministic runtime corpus
        run: python scripts/build_runtime_corpus.py

      - name: Commit generated corpus when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- runtime-corpus.json; then
            echo "Runtime corpus already matches the source documentation."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-corpus.json
          git commit -m "docs: regenerate Memory runtime corpus"
          git push origin HEAD:skr-docs-memory-completeness
