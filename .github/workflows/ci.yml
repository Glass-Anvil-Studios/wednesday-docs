name: Docs CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test publication security gates
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Verify deterministic SKR runtime corpus
        run: python scripts/build_runtime_corpus.py --check

      - name: Validate SKR runtime corpus
        run: python scripts/validate_runtime_corpus.py

      - name: Enforce public release firewall
        run: python scripts/public_release_firewall.py

      - name: Validate positive public contract
        run: python scripts/validate_public_contract.py

      - name: Validate production contract snapshot
        run: python scripts/validate_production_contract_snapshot.py

      - name: Validate documentation sources
        run: python scripts/validate_docs.py

      - name: Build production site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Validate generated site
        run: python scripts/validate_site.py _site

      - name: Enforce firewall on generated site
        run: python scripts/public_release_firewall.py --generated _site
