name: Docs CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: docs-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test publication security gates
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Build SKR runtime corpus
        run: python scripts/build_runtime_corpus.py

      - name: Materialize bootstrap runtime corpus
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ -z "$(git status --porcelain -- runtime-corpus.json)" ]]; then
            echo "runtime-corpus.json already matches"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-corpus.json
          git commit -m "SKR-02: materialize deterministic runtime corpus"
          git push origin HEAD:"${HEAD_REF}"

      - name: Upload SKR runtime corpus bootstrap artifact
        uses: actions/upload-artifact@v4
        with:
          name: skr-runtime-corpus
          path: runtime-corpus.json
          if-no-files-found: error

      - name: Enforce public release firewall
        run: python scripts/public_release_firewall.py

      - name: Validate positive public contract
        run: python scripts/validate_public_contract.py

      - name: Validate production contract snapshot
        run: python scripts/validate_production_contract_snapshot.py

      - name: Validate documentation sources
        run: python scripts/validate_docs.py

      - name: Build production site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Validate generated site
        run: python scripts/validate_site.py _site

      - name: Enforce firewall on generated site
        run: python scripts/public_release_firewall.py --generated _site
