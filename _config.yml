title: WEDNESDAY Developer Platform
short_title: WEDNESDAY Docs
description: Official developer documentation for the WEDNESDAY platform, APIs, models, agents, tools, integrations, security, and production behavior.
url: https://docs.wednesdaychat.com
baseurl: ""
lang: en
markdown: kramdown
permalink: pretty
kramdown:
  input: GFM
  syntax_highlighter_opts:
    block:
      line_numbers: false
exclude:
  - scripts
  - tests
  - policy
  - docs
  - .github
  - CONTRIBUTING.md
  - SECURITY.md
  - README.md
  - LICENSE
defaults:
  - scope:
      path: ""
    values:
      layout: default
